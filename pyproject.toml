[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspy-monty-interpreter"
version = "0.6.3"
description = "DSPy CodeInterpreter implementation using Monty, a secure Python interpreter written in Rust"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "dspy>=3.4.0",
    "pydantic-monty>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.20",
]
# OpenTelemetry spans for execute() and dspy_monty_interpreter.instrument().
telemetry = [
    "opentelemetry-api>=1.20",
]
# Live RLM scripts in scripts/, which send traces to cmpnd.
scripts = [
    "python-dotenv>=1.0",
    "cmpnd>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that call a live LLM API (requires API key in .env)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_monty_interpreter"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Ad hoc tooling with long prompt and description strings.
"scripts/*" = ["E501"]
"benchmarks/*" = ["E501"]

[tool.ruff.lint.isort]
known-local-folder = ["_support"]
